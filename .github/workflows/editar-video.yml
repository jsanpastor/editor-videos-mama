name: Editar vídeo

# Lo lanza Apps Script cuando mamá pulsa "Editar mi vídeo". Para repetir un
# vídeo, usa el botón "Reintentar" de la web (genera una llave nueva).
on:
  repository_dispatch:
    types: [editar-video]

run-name: Editar vídeo ${{ github.event.client_payload.id }}

permissions:
  contents: read

jobs:
  editar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar ffmpeg y fuentes de emojis
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # A veces los servidores de paquetes se quedan colgados: límite de
          # tiempo por intento y hasta 3 intentos.
          for intento in 1 2 3; do
            if timeout 180 sudo -E apt-get update -qq -o Acquire::Retries=3 &&
               timeout 240 sudo -E apt-get install -y -qq --no-install-recommends                  -o Acquire::Retries=3 ffmpeg fonts-noto-color-emoji > /dev/null; then
              ffmpeg -version | head -1
              exit 0
            fi
            echo "Intento $intento fallido, reintentando..."
            sleep 10
          done
          exit 1

      # whisper.cpp se compila para el procesador concreto: la caché va por modelo de
      # CPU, si no un binario compilado en otra máquina falla con SIGILL
      - name: Modelo de procesador
        id: cpu
        run: echo "hash=$(grep -m1 'model name' /proc/cpuinfo | md5sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Caché de whisper (transcripción)
        uses: actions/cache@v4
        with:
          path: .whisper
          key: whisper-1.7.6-small-${{ runner.os }}-${{ steps.cpu.outputs.hash }}

      - run: npm ci

      - name: Preparar Chrome para Remotion
        run: npx remotion browser ensure

      # Claude Code con la suscripción del dueño (token de `claude setup-token`):
      # no gasta créditos de la API de pago
      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code && claude --version

      - name: Editar el vídeo
        run: npm run procesar
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
